version: '3.8'

services:
  bank-marketing-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank-marketing-predictor
    ports:
      - "8501:8501"
    volumes:
      # Mount models directory (if models exist locally)
      - ./src/models:/app/src/models:ro
      # Mount preprocessor (if it exists locally)
      - ./src/preprocessing:/app/src/preprocessing:ro
      # Mount config (for easy updates)
      - ./config:/app/config:ro
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
