name: CI Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest black flake8 mypy scikit-learn joblib xgboost imbalanced-learn

    - name: Check code formatting with black
      run: |
        black --check src/ tests/

    - name: Lint with flake8
      run: |
        flake8 src/ tests/ --max-line-length=100 --extend-ignore=E203,W503

    - name: Type check with mypy
      run: |
        mypy src/ --ignore-missing-imports --no-strict-optional || true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: []

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest scikit-learn joblib xgboost imbalanced-learn

    - name: Download dataset
      run: |
        mkdir -p data/raw/bank
        wget -O data/raw/bank/bank-full.csv "https://toeflist-bucket.storage.c2.liara.space/bank-full.csv" || exit 1
        # Verify the file was created
        if [ ! -f "data/raw/bank/bank-full.csv" ]; then
          echo "Error: bank-full.csv was not downloaded"
          exit 1
        fi
        echo "Dataset downloaded successfully: $(ls -lh data/raw/bank/bank-full.csv)"

    - name: Run tests
      run: |
        pytest tests/ -v

  verify-scripts:
    name: Verify Scripts Execution
    runs-on: ubuntu-latest
    needs: []

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install scikit-learn joblib xgboost imbalanced-learn

    - name: Download dataset
      run: |
        mkdir -p data/raw/bank
        wget -O data/raw/bank/bank-full.csv "https://toeflist-bucket.storage.c2.liara.space/bank-full.csv" || exit 1
        # Verify the file was created
        if [ ! -f "data/raw/bank/bank-full.csv" ]; then
          echo "Error: bank-full.csv was not downloaded"
          exit 1
        fi
        echo "Dataset downloaded successfully: $(ls -lh data/raw/bank/bank-full.csv)"

    - name: Run EDA script
      run: |
        python run_eda.py

    - name: Run preprocessing script
      env:
        WANDB_MODE: offline
      run: |
        python -m src.preprocessing.main
        
    - name: Verify preprocessor was saved
      run: |
        if [ ! -f "src/models/preprocessor.pkl" ]; then
          echo "Error: preprocessor.pkl was not saved correctly"
          exit 1
        fi
        echo "Preprocessor saved successfully"

    - name: Upload generated artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: generated-files
        path: |
          reports/figures/
          data/processed/
        retention-days: 1

